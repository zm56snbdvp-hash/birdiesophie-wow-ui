name: Package BirdieSophieUI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate addon
        run: |
          test -f addon/BirdieSophieUI/BirdieSophieUI.toc
          test -f addon/BirdieSophieUI/Core.lua

      - name: Build package
        run: |
          mkdir -p dist
          cd addon
          zip -r ../dist/BirdieSophieUI-${GITHUB_REF_NAME}.zip BirdieSophieUI

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --title "BirdieSophieUI ${GITHUB_REF_NAME}" \
            --generate-notes

