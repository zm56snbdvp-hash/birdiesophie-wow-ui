name: Package BirdieSophieUI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate addon
        run: |
          test -f addon/BirdieSophieUI/BirdieSophieUI.toc
          test -f addon/BirdieSophieUI/Core.lua

      - name: Build package
        run: |
          mkdir -p dist
          cd addon
          zip -r ../dist/BirdieSophieUI-${GITHUB_REF_NAME}.zip BirdieSophieUI

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true

